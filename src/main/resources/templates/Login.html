<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sign In | Food Frenzy</title>
	<link rel="stylesheet" th:href="@{/css/main.css}" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
	<script th:src="@{/JavaScript/theme.js}"></script>
</head>

<body>
	<nav th:replace="~{Navigation::navbar()}"></nav>

	<div class="auth-wrapper">
		<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 36px; width: 100%; max-width: 1000px;">
			
			<!-- Admin Login Card -->
			<div class="auth-card animate-up">
				<div style="margin-bottom: 32px; text-align: center;">
					<div style="width: 52px; height: 52px; background: rgba(247, 147, 26, 0.12); border: 1px solid rgba(247, 147, 26, 0.3); border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; box-shadow: 0 0 15px rgba(247, 147, 26, 0.2);">
						<i class="fa-solid fa-shield-halved" style="color: var(--primary); font-size: 1.3rem;"></i>
					</div>
					<h2 style="font-size: 1.6rem; margin-bottom: 6px;">Admin Portal</h2>
					<p style="font-size: 0.875rem; color: var(--muted);">Authenticate to access system console</p>
				</div>

				<form th:action="@{/adminLogin}" method="post">
					<div style="margin-bottom: 20px;">
						<label style="font-size: 0.825rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;">Admin Identifier / Email</label>
						<input type="email" name="email" placeholder="admin@foodfrenzy.com" class="input-field" required>
					</div>
					<div style="margin-bottom: 24px;">
						<label style="font-size: 0.825rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;">Security Passkey</label>
						<input type="password" name="password" placeholder="••••••••" class="input-field" required>
					</div>
					<p th:if="${error}" th:text="${error}" style="color: var(--accent-red); font-size: 0.875rem; margin-bottom: 16px; text-align: center;"></p>
					<button type="submit" class="btn btn-outline" style="width: 100%; border-color: var(--primary); color: var(--primary);">
						<i class="fa-solid fa-key"></i> Authenticate Admin
					</button>
				</form>
			</div>

			<!-- User Login Card -->
			<div class="auth-card animate-up" style="animation-delay: 0.1s;">
				<div style="margin-bottom: 32px; text-align: center;">
					<div style="width: 52px; height: 52px; background: rgba(234, 88, 12, 0.12); border: 1px solid rgba(234, 88, 12, 0.3); border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; box-shadow: 0 0 15px rgba(234, 88, 12, 0.2);">
						<i class="fa-solid fa-user" style="color: var(--primary); font-size: 1.3rem;"></i>
					</div>
					<h2 style="font-size: 1.6rem; margin-bottom: 6px;">Customer Sign In</h2>
					<p style="font-size: 0.875rem; color: var(--muted);">Welcome back to gourmet dining!</p>
				</div>

				<form th:action="@{/userLogin}" method="post">
					<div style="margin-bottom: 20px;">
						<label style="font-size: 0.825rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;">Registered Email</label>
						<input type="email" name="userEmail" placeholder="you@example.com" class="input-field" required>
					</div>
					<div style="margin-bottom: 24px;">
						<label style="font-size: 0.825rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;">Password</label>
						<input type="password" name="userPassword" placeholder="••••••••" class="input-field" required>
					</div>
					<p th:if="${error2}" th:text="${error2}" style="color: var(--accent-red); font-size: 0.875rem; margin-bottom: 16px; text-align: center;"></p>
					<button type="submit" class="btn btn-primary" style="width: 100%;">
						Sign In <i class="fa-solid fa-arrow-right" style="margin-left: 4px;"></i>
					</button>

					<div th:if="${googleOAuthEnabled}">
					<div style="margin: 22px 0; display: flex; align-items: center; color: var(--muted); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;">
						<div style="flex: 1; height: 1px; background: var(--border-subtle);"></div>
						<span style="padding: 0 12px;">Or continue with</span>
						<div style="flex: 1; height: 1px; background: var(--border-subtle);"></div>
					</div>

					<a th:href="@{/oauth2/authorization/google}" class="btn btn-outline" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600;">
						<img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="18" alt="Google Logo">
						Google Account
					</a>
				</div>
				</form>
				<p style="margin-top: 24px; text-align: center; font-size: 0.875rem; color: var(--muted);">
					New to Food Frenzy? <a th:href="@{/register}" style="color: var(--primary); font-weight: 700; text-decoration: none;">Create an account</a>
				</p>
			</div>
		</div>
	</div>

	<footer style="padding: 40px 5%; text-align: center; color: var(--muted); font-size: 0.85rem; border-top: 1px solid var(--border-subtle);">
		&copy; 2026 Food Frenzy. Cryptographically Protected & Secured.
	</footer>
</body>
</html>
