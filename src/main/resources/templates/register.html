<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Food Frenzy</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script th:src="@{/JavaScript/theme.js}"></script>
</head>

<body>
    <nav th:replace="~{Navigation::navbar()}"></nav>

    <div class="auth-wrapper">
        <div class="auth-card animate-up">
            <div style="margin-bottom: 32px; text-align: center;">
                <div style="width: 52px; height: 52px; background: rgba(247, 147, 26, 0.12); border: 1px solid rgba(247, 147, 26, 0.3); border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; box-shadow: 0 0 15px rgba(247, 147, 26, 0.2);">
                    <i class="fa-solid fa-user-plus" style="color: var(--primary); font-size: 1.3rem;"></i>
                </div>
                <h2 style="font-size: 1.75rem; margin-bottom: 8px;">Create Account</h2>
                <p style="font-size: 0.875rem; color: var(--muted);">Join the decentralized culinary network</p>
            </div>

            <form th:action="@{/register}" method="post" th:object="${userRegistration}">
                <div style="margin-bottom: 16px;">
                    <label style="font-size: 0.825rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;">Full Name</label>
                    <input type="text" th:field="*{uname}" placeholder="Satoshi Nakamoto" class="input-field" required>
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="font-size: 0.825rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;">Email Address</label>
                    <input type="email" th:field="*{uemail}" placeholder="satoshi@example.com" class="input-field" required>
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="font-size: 0.825rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;">Phone Number</label>
                    <input type="text" th:field="*{unumber}" placeholder="+91 9876543210" class="input-field" required>
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="font-size: 0.825rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;">Choose Password</label>
                    <input type="password" th:field="*{upassword}" placeholder="••••••••" class="input-field" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px;">
                    Register Account <i class="fa-solid fa-arrow-right" style="margin-left: 6px;"></i>
                </button>
            </form>

            <p th:if="${error}" th:text="${error}" style="color: var(--accent-red); font-size: 0.875rem; margin-top: 16px; text-align: center;"></p>
            
            <p style="margin-top: 24px; text-align: center; font-size: 0.875rem; color: var(--muted);">
                Already registered? <a th:href="@{/login}" style="color: var(--primary); font-weight: 700; text-decoration: none;">Sign In</a>
            </p>
        </div>
    </div>

    <footer style="padding: 48px 5%; text-align: center; color: var(--muted); font-size: 0.85rem; border-top: 1px solid var(--border-subtle);">
        &copy; 2026 Food Frenzy. Cryptographically Protected.
    </footer>
</body>

</html>
