<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>System Exception | Food Frenzy</title>
	<link rel="stylesheet" th:href="@{/css/main.css}">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
	<script th:src="@{/JavaScript/theme.js}"></script>
	<style>
		.error-wrapper {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 40px 20px;
		}
		.error-card {
			background: var(--surface-matter);
			border: 1px solid rgba(239, 68, 68, 0.4);
			border-radius: var(--radius-xl);
			padding: 48px;
			max-width: 540px;
			width: 100%;
			text-align: center;
			box-shadow: 0 0 40px -10px rgba(239, 68, 68, 0.2);
		}
		.error-icon {
			width: 72px;
			height: 72px;
			background: rgba(239, 68, 68, 0.15);
			border: 1px solid rgba(239, 68, 68, 0.4);
			border-radius: var(--radius-full);
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0 auto 24px;
			box-shadow: 0 0 25px rgba(239, 68, 68, 0.3);
		}
		.error-icon i {
			font-size: 2rem;
			color: var(--accent-red);
		}
	</style>
</head>

<body>
	<div class="error-wrapper">
		<div class="error-card animate-up">
			<div class="error-icon">
				<i class="fa-solid fa-triangle-exclamation"></i>
			</div>
			<span class="badge-node" style="background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.3); color: var(--accent-red); margin-bottom: 16px;">
				Protocol Error (500)
			</span>
			<h2 style="font-size: 2rem; margin: 12px 0 8px; letter-spacing: -0.03em;">Operation Interrupted</h2>
			<p style="color: var(--muted); font-size: 0.95rem; margin-bottom: 24px;">An unhandled exception occurred during transaction processing.</p>

			<div class="receipt-box" style="text-align: left;">
				<p style="font-size: 0.85rem; color: var(--muted); line-height: 1.6;">
					<strong style="color: var(--foreground);">Possible Causes:</strong><br>
					• Attempting to insert duplicate email records.<br>
					• Submitting empty or malformed required parameters.
				</p>
			</div>

			<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
				<a href="/home" class="btn btn-outline">Return Home</a>
				<a href="/login" class="btn btn-primary">Sign In</a>
			</div>
		</div>
	</div>
</body>

</html>
